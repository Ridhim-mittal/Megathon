<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone preview · Lakshyam</title>
    <style>
      body { margin: 0; font-family: "DM Sans Variable", system-ui, sans-serif; color: #2b2238; }
      /* A stand-in for the village map behind the phone. */
      .pv-map {
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(#9ccf86, #6fae5f);
      }
      /* Kept in the top-left corner so it never covers the phone. */
      .pv-bar {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: 260px;
        flex-wrap: wrap;
        z-index: 60;
        display: flex;
        gap: 8px 14px;
        align-items: center;
        padding: 8px 14px;
        background: #2b2238;
        color: #fff8e7;
        font-size: 14px;
      }
      .pv-bar button { font: inherit; padding: 2px 10px; }
      .pv-langs { display: flex; gap: 4px; }
      .pv-langs button[aria-pressed="true"] { background: #f2c14e; }
      .pv-card {
        max-width: 520px;
        margin: 60px auto;
        background: #fffdf6;
        border: 4px solid #2b2238;
        box-shadow: 6px 6px 0 #2b2238;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pv-card h2 { margin: 0; }
      .pv-card button { font: inherit; text-align: left; padding: 8px 10px; border: 3px solid #2b2238; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/phone/preview.jsx"></script>
  </body>
</html>
